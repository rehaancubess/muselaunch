<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:393px;height:852px;background:#F2F2F7;font-family:'DejaVu Sans',Arial,sans-serif;color:#1C1C1E;overflow:hidden}
.status{height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px;font-weight:600;font-size:16px}
.title{padding:12px 20px 14px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.box{margin:0 20px 14px;background:#fff;border-radius:18px;padding:18px}
.h{font-weight:600;font-size:16px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:12px;height:160px}
.bars div{flex:1;border-radius:8px 8px 4px 4px;background:#5E5CE6}
.lbl{display:flex;gap:12px;margin-top:8px;color:#8E8E93;font-size:12px}.lbl span{flex:1;text-align:center}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EFEFF4;font-size:15px}.row:last-child{border:0}
.row b{color:#5E5CE6}
.tab{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(249,249,249,.94);border-top:1px solid #D1D1D6;display:flex;justify-content:space-around;padding-top:10px;font-size:11px;color:#8E8E93}
.tab b{display:block;width:26px;height:26px;border-radius:8px;background:#C7C7CC;margin:0 auto 4px}.tab .on{color:#5E5CE6}.tab .on b{background:#5E5CE6}
</style></head><body>
<div class="status"><span>9:41</span><span>100%</span></div>
<div class="title">This week</div>
<div class="box"><div class="h">Focus hours</div><div class="bars"><div style="height:45%"></div><div style="height:70%"></div><div style="height:58%"></div><div style="height:88%"></div><div style="height:64%"></div><div style="height:30%;opacity:.4"></div><div style="height:20%;opacity:.4"></div></div>
<div class="lbl"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div>
<div class="box"><div class="row">Longest streak<b>6 days</b></div><div class="row">Blocks completed<b>23</b></div><div class="row">Best time to focus<b>9–11am</b></div></div>
<div class="tab"><div><b></b>Today</div><div><b></b>Plan</div><div class="on"><b></b>Stats</div><div><b></b>Settings</div></div>
</body></html>
