<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:393px;height:852px;background:#F2F2F7;font-family:'DejaVu Sans',Arial,sans-serif;color:#1C1C1E;overflow:hidden}
.status{height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px;font-weight:600;font-size:16px}
.title{padding:12px 20px 4px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.sub{padding:0 20px 14px;color:#8E8E93;font-size:15px}
.ring{margin:6px 20px 16px;background:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;gap:16px}
.r{width:74px;height:74px;border-radius:50%;background:conic-gradient(#5E5CE6 0 68%,#E5E5EA 68% 100%);display:grid;place-items:center}
.r i{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:17px}
.card{margin:0 20px 12px;background:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.bar{width:5px;align-self:stretch;border-radius:3px}
.t{font-weight:600;font-size:16px}.m{color:#8E8E93;font-size:13px;margin-top:3px}
.time{margin-left:auto;color:#8E8E93;font-size:13px}
.tab{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(249,249,249,.94);border-top:1px solid #D1D1D6;display:flex;justify-content:space-around;padding-top:10px;font-size:11px;color:#8E8E93}
.tab b{display:block;width:26px;height:26px;border-radius:8px;background:#C7C7CC;margin:0 auto 4px}.tab .on{color:#5E5CE6}.tab .on b{background:#5E5CE6}
.fab{position:absolute;right:22px;bottom:104px;width:58px;height:58px;border-radius:50%;background:#5E5CE6;color:#fff;font-size:34px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(94,92,230,.4)}
</style></head><body>
<div class="status"><span>9:41</span><span>100%</span></div>
<div class="title">Today</div><div class="sub">Tuesday, 27 October</div>
<div class="ring"><div class="r"><i>68%</i></div><div><div class="t">Focus goal</div><div class="m">2h 43m of 4h planned</div></div></div>
<div class="card"><div class="bar" style="background:#5E5CE6"></div><div><div class="t">Deep work: launch deck</div><div class="m">Focus block</div></div><div class="time">9:00</div></div>
<div class="card"><div class="bar" style="background:#FF9F0A"></div><div><div class="t">Inbox zero</div><div class="m">Admin</div></div><div class="time">11:00</div></div>
<div class="card"><div class="bar" style="background:#30D158"></div><div><div class="t">Walk + lunch</div><div class="m">Recharge</div></div><div class="time">12:30</div></div>
<div class="card"><div class="bar" style="background:#5E5CE6"></div><div><div class="t">Design review</div><div class="m">Focus block</div></div><div class="time">14:00</div></div>
<div class="card"><div class="bar" style="background:#FF375F"></div><div><div class="t">Gym</div><div class="m">Health</div></div><div class="time">18:00</div></div>
<div class="fab">+</div>
<div class="tab"><div class="on"><b></b>Today</div><div><b></b>Plan</div><div><b></b>Stats</div><div><b></b>Settings</div></div>
</body></html>
