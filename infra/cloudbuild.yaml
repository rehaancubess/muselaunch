# Builds all MuseLaunch images. Invoked by scripts/deploy.ts (substitutions supplied there).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/docker/node.Dockerfile", "--build-arg", "SERVICE=api", "-t", "${_REPO}/api:${_TAG}", "-t", "${_REPO}/api:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/docker/node.Dockerfile", "--build-arg", "SERVICE=worker", "-t", "${_REPO}/worker:${_TAG}", "-t", "${_REPO}/worker:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/docker/render.Dockerfile", "-t", "${_REPO}/render:${_TAG}", "-t", "${_REPO}/render:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/web.Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_CONTACT_EMAIL=${_CONTACT_EMAIL}
      - --build-arg
      - NEXT_PUBLIC_OPERATOR_NAME=${_OPERATOR_NAME}
      - -t
      - ${_REPO}/web:${_TAG}
      - -t
      - ${_REPO}/web:latest
      - .
images:
  - ${_REPO}/api:latest
  - ${_REPO}/worker:latest
  - ${_REPO}/render:latest
  - ${_REPO}/web:latest
  - ${_REPO}/api:${_TAG}
  - ${_REPO}/worker:${_TAG}
  - ${_REPO}/render:${_TAG}
  - ${_REPO}/web:${_TAG}
substitutions:
  _CONTACT_EMAIL: ""
  _OPERATOR_NAME: ""
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
